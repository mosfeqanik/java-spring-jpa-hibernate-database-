<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Book API Tester</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      padding: 30px;
    }

    .container {
      max-width: 800px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    .request-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    select, input {
      padding: 10px;
      font-size: 14px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    input {
      flex: 1;
    }

    textarea {
      width: 100%;
      height: 150px;
      padding: 10px;
      margin-top: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
      font-family: monospace;
    }

    button {
      margin-top: 15px;
      padding: 12px 20px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #0056b3;
    }

    pre {
      background: #f0f0f0;
      padding: 15px;
      border-radius: 5px;
      margin-top: 20px;
      overflow-x: auto;
    }

    .status {
      margin-top: 10px;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Book API Tester</h1>

    <!-- Method + Endpoint Selector -->
    <div class="request-bar">
      <select id="method" onchange="toggleBody()">
        <option value="POST">POST</option>
        <option value="GET">GET</option>
      </select>

      <select id="endpoint" onchange="updateUrl()">
        <option value="all">All Books</option>
        <option value="title">Search by Title</option>
        <option value="author">Search by Author</option>
      </select>

      <input type="text" id="url" placeholder="/books">
    </div>

    <!-- JSON Body for POST -->
    <textarea id="jsonBody" placeholder='{
  "title": "Spring Boot Basics",
  "author": "Alice",
  "isbn": "1234567890"
}'></textarea>

    <button onclick="sendRequest()">Send</button>

    <div class="status" id="status"></div>

    <h3>Response</h3>
    <pre id="response"></pre>
  </div>

  <script>
    function toggleBody() {
      const method = document.getElementById("method").value;
      const body = document.getElementById("jsonBody");
      const endpoint = document.getElementById("endpoint");

      if (method === "POST") {
        body.style.display = "block";
        endpoint.disabled = true;
        document.getElementById("url").value = "/book";
      } else {
        body.style.display = "none";
        endpoint.disabled = false;
        updateUrl();
      }
    }

    function updateUrl() {
      const endpoint = document.getElementById("endpoint").value;
      const input = document.getElementById("url");

      if (endpoint === "all") {
        input.value = "/books";
      } else if (endpoint === "title") {
        input.value = "/books/title/";
      } else if (endpoint === "author") {
        input.value = "/books/author/";
      }
    }

    async function sendRequest() {
      let method = document.getElementById("method").value;
      let url = document.getElementById("url").value;
      const body = document.getElementById("jsonBody").value;
      const responseBox = document.getElementById("response");
      const statusBox = document.getElementById("status");

      // Append search term for GET by title/author
      if (method === "GET") {
        const endpoint = document.getElementById("endpoint").value;
        if ((endpoint === "title" || endpoint === "author") && url.endsWith("/")) {
          const term = prompt(`Enter ${endpoint}:`);
          if (!term) {
            alert("Search term required!");
            return;
          }
          url += encodeURIComponent(term);
        }
      }

      try {
        const options = { method };

        if (method === "POST") {
          options.headers = { "Content-Type": "application/json" };
          options.body = body;
        }

        const response = await fetch(url, options);

        statusBox.textContent = "Status: " + response.status + " " + response.statusText;

        const contentType = response.headers.get("content-type");

        let text;
        if (contentType && contentType.includes("application/json")) {
          text = JSON.stringify(await response.json(), null, 2);
        } else {
          text = await response.text();
        }

        responseBox.textContent = text || "No Content";
      } catch (error) {
        responseBox.textContent = "Error: " + error;
      }
    }

    toggleBody();
  </script>
</body>
</html>
