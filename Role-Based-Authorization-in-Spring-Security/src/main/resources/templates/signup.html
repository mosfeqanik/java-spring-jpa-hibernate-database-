<!DOCTYPE html>
<html>
<head>
<title>Signup</title>
<style>
body {
    font-family: Arial;
    background: linear-gradient(to right, #43e97b, #38f9d7);
    text-align: center;
}
.container {
    margin-top: 100px;
    background: white;
    padding: 30px;
    display: inline-block;
    border-radius: 10px;
}
input {
    padding: 10px;
    margin: 10px;
    width: 200px;
}
button {
    padding: 10px 20px;
    background: #43e97b;
    color: white;
    border: none;
}
</style>
</head>
<body>

<div class="container">
<h2>Sign Up</h2>

<form action="/register" method="post">
    <input type="text" name="username" placeholder="Username"><br>
    <input type="password" name="password" placeholder="Password"><br>
    <button type="submit">Register</button>
</form>

</div>

</body>
</html>
